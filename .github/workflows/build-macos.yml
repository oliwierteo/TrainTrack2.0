name: Buduj TrainTrack na macOS

# Uruchamiasz ręcznie: zakładka Actions → Build macOS → Run workflow
# albo automatycznie po wypchnięciu tagu, np. v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Kompilacja .app
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Ustawienie Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # build.py kończy się KODEM BŁĘDU, gdy kompilacja padnie
      # (wcześniej chwytał wyjątek i wychodził z 0 - GitHub wtedy
      # uważał krok za udany, a następny wywalał się bez przyczyny).
      - name: Budowanie aplikacji
        id: build
        continue-on-error: true
        run: python build.py

      # Plan awaryjny: universal2 (plik na stare i nowe Maci) potrafi
      # nie przejść na maszynie GitHuba. Powtarzamy bez niego - wtedy
      # powstanie .app tylko dla architektury tej maszyny.
      - name: Powtórka bez universal2
        if: steps.build.outcome == 'failure'
        run: |
          echo "Pierwsza próba nie powiodła się - próbuję bez universal2."
          TT_NO_UNIVERSAL=1 python build.py

      - name: Sprawdzenie, czy .app powstało
        run: |
          echo "--- zawartość dist/ ---"
          ls -la dist/ || echo "dist/ nie istnieje"
          if [ ! -d dist/TrainTrack.app ]; then
            echo ""
            echo "======================================================"
            echo "NIE POWSTAŁO dist/TrainTrack.app"
            echo "Powyżej jest PRAWDZIWY błąd kompilacji - przewiń do"
            echo "pierwszej linijki na czerwono i podeślij ją."
            echo "======================================================"
            exit 1
          fi
          echo "OK - TrainTrack.app istnieje"

      # ditto to macowy odpowiednik "spakuj folder", zachowuje uprawnienia
      # i atrybuty podpisu - zwykły zip potrafi zepsuć aplikację .app
      - name: Spakowanie do .zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent TrainTrack.app TrainTrack-macOS.zip
          ls -lh TrainTrack-macOS.zip

      - name: Pobranie gotowego pliku
        uses: actions/upload-artifact@v4
        with:
          name: TrainTrack-macOS
          path: dist/TrainTrack-macOS.zip
          retention-days: 30
          if-no-files-found: error

  # Opcjonalnie: przy tagu v* wypuszcza gotowy plik jako "Release",
  # żeby dało się go pobrać bez logowania do Actions
  release:
    name: Wydanie na GitHubie
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie zbudowanej aplikacji
        uses: actions/download-artifact@v4
        with:
          name: TrainTrack-macOS
          path: artefakt

      - name: Publikacja Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefakt/TrainTrack-macOS.zip
          generate_release_notes: true
